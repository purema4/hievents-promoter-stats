services:
  promoter-stats:
    build: .
    image: hievents-promoter-stats:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      # Holds promoter logins and code assignments. Back it up; do not prune it.
      - promoter-data:/data

volumes:
  promoter-data:
