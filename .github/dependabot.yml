version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Base image in Dockerfile (oven/bun).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The rules engine: cel-go and its Go dependencies, and its base images (golang, distroless).
  - package-ecosystem: gomod
    directory: /rules-engine
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /rules-engine
    schedule:
      interval: weekly
