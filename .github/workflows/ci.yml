name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# A newer commit on the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/purema4/hievents-promoter-stats

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Same as: docker compose -f docker-compose.dev.yml -f docker-compose.test.yml ...
      COMPOSE_FILE: docker-compose.dev.yml:docker-compose.test.yml
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Start test stack (Postgres, Mailpit, CDN)
        run: docker compose up -d --wait hievents-db mailpit cdn

      - name: Run tests
        env:
          CI: "true"
        run: bun test

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down test stack
        if: always()
        run: docker compose down -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: bun audit
        # Exits non-zero when any installed package has a known vulnerability.
        run: bun audit

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the last commit
          persist-credentials: false

      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  dast:
    name: DAST (ZAP baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start sandbox stack
        run: docker compose -f docker-compose.dev.yml up -d --build --wait

      - name: Wait for /healthz
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz; then exit 0; fi
            sleep 2
          done
          echo "::error::The app did not answer /healthz within 120 s"
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          artifact_name: zap-baseline-report
          # Fail on alerts that .zap/rules.tsv marks FAIL; WARN alerts are reported only (-I).
          fail_action: true
          cmd_options: -I

      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color

      - name: Tear down sandbox stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  build:
    name: Build, scan and publish image
    needs: [test, audit, secrets, dast]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # only used by the push steps, which run on push to main
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=hievents-promoter-stats
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          version: v0.75.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # Pushes exactly the image Trivy scanned, as :<sha> and :latest.
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
