# Test stack: the sandbox services from docker-compose.dev.yml on fixed localhost ports, for `bun test`.
# Only ever used together with docker-compose.dev.yml:
#   docker compose -p promoterstats-tests -f docker-compose.dev.yml -f docker-compose.test.yml up -d --wait hievents-db mailpit cdn s3
# The app itself is not started here: the integration tests run `bun src/index.tsx` against these services.
services:
  hievents-db:
    ports: !override
      - "127.0.0.1:55432:5432"
    # Over TCP and as the read-only role: healthy only once the seed and the role scripts have run
    # (during initdb the server listens on the unix socket only, so a plain pg_isready passes too early).
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=change-me psql -h 127.0.0.1 -U promoter_stats -d hi-events -tAc 'SELECT 1 FROM promo_codes LIMIT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    # Replaces the dev port (8027) so the test stack can run next to a dev stack.
    ports: !override
      - "127.0.0.1:11025:1025"
      - "127.0.0.1:18025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  cdn:
    ports: !override
      - "127.0.0.1:18080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/event_cover/warehouse.png"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage for the S3_BUCKET and CDN_URL tests. Healthy once the bucket exists; its files can
  # be read without a key, like a bucket behind a CDN (the CDN tests use it as the CDN).
  s3:
    # RELEASE.2025-09-07T16-13-09Z. Pinned by digest: Docker Hub no longer serves MinIO's version tags.
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data
    environment:
      MINIO_ROOT_USER: promoter-test
      MINIO_ROOT_PASSWORD: promoter-test-secret
    ports:
      - "127.0.0.1:19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc alias set t http://127.0.0.1:9000 promoter-test promoter-test-secret >/dev/null && mc mb -p t/promoter-test >/dev/null && mc anonymous set download t/promoter-test >/dev/null"]
      interval: 2s
      timeout: 10s
      retries: 30

  # Not needed by the tests; keep it off the dev port if someone starts the whole file.
  promoter-stats:
    ports: !reset []
